apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: bookstore-cluster
  region: us-east-1

nodeGroups:
  - name: bookstore-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    volumeSize: 20
    ssh:
      allow: false
    labels:
      role: worker
    tags:
      Environment: dev
      Project: bookstore

# Enable IAM OIDC provider
iam:
  withOIDC: true

# CloudWatch logging
cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator", "controllerManager", "scheduler"]
