apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cicd-deployer
  namespace: bookstore
rules:
- apiGroups: ["", "apps"]
  resources:
    - deployments
    - services
    - pods
    - replicasets
    - configmaps
  verbs: ["get", "list", "create", "update", "delete"]

- apiGroups: ["autoscaling"]
  resources:
    - horizontalpodautoscalers
  verbs: ["get", "list", "create", "update", "delete"]
