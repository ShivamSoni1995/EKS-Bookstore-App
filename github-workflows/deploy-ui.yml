name: Deploy BookApp UI to EKS

on:
  push:
    branches:
      - main
    paths:
      - 'Project-3/ui/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: bookstore-cluster
  ECR_REPOSITORY: shivamsoni1995/bookapp-ui
  
jobs:
  build-and-deploy:
    name: Build and Deploy UI
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.ECR_REPOSITORY }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./Project-3/ui
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}
    
    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
    
    - name: Deploy to EKS
      run: |
        kubectl set image deployment/bookapp-ui bookapp-ui=${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }} -n bookstore
        kubectl rollout status deployment/bookapp-ui -n bookstore --timeout=300s
        kubectl get pods -n bookstore -l app=bookapp-ui
    
    - name: Health check
      run: |
        sleep 30
        INGRESS_URL=$(kubectl get ingress bookstore-ingress -n bookstore -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        if [ ! -z "$INGRESS_URL" ]; then
          echo "Application URL: http://$INGRESS_URL"
        else
          echo "Ingress URL not yet available. Check AWS Load Balancer Controller status."
        fi
