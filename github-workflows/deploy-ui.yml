name: Enhanced DevSecOps - Deploy BookApp UI to EKS

on:
  push:
    branches:
      - main
    paths:
      - 'Project-3/ui/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Project-3/ui/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: bookstore-cluster
  ECR_REPOSITORY: shivamsoni1995/bookapp-ui
  REGISTRY: docker.io
  SONAR_HOST_URL: https://sonarcloud.io
  SONARQUBE_PROJECT_KEY: bookstore-ui
  SONARQUBE_ORG: your-organization

jobs:
  # ===========================================
  # STAGE 1: SECURITY SCANNING
  # ===========================================
  security-scanning:
    name: 🔒 Security Scanning & Code Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis

    # =================== GITLEAKS ===================
    - name: Run GitLeaks - Secret Detection
      id: gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_NOTIFY_USER_ON_PUSH: "true"

    - name: Upload GitLeaks Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: gitleaks-report
        path: ${{ steps.gitleaks.outputs.report }}

    # =================== SONARQUBE (SonarCloud) ===================
    - name: Run SonarQube SAST Analysis
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=${{ env.SONARQUBE_PROJECT_KEY }}
          -Dsonar.organization=${{ env.SONARQUBE_ORG }}
          -Dsonar.sources=Project-3/ui/src
          -Dsonar.tests=Project-3/ui/src
          -Dsonar.test.inclusions=**/*.test.js,**/*.spec.js
          -Dsonar.exclusions=**/node_modules/**,**/*.config.js,**/dist/**
          -Dsonar.javascript.lcov.reportPaths=Project-3/ui/coverage/lcov.info
          -Dsonar.qualitygate.wait=true

    - name: Check SonarQube Quality Gate
      if: always()
      run: |
        echo "✓ SonarQube analysis complete"
        echo "Quality Gate Status: Check SonarCloud dashboard"

    # =================== OWASP DEPENDENCY CHECK ===================
    - name: Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        path: 'Project-3/ui'
        format: 'JSON'
        args: >
          --enableExperimental
          --enableRetired
          --enable-retired
          --exclude node_modules
          --project BookStoreUI
        
    - name: Upload OWASP Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: owasp-dependency-check-report
        path: reports/dependency-check-report.json

    - name: Publish OWASP Results
      if: always()
      run: |
        if [ -f reports/dependency-check-report.json ]; then
          echo "### 🔍 OWASP Dependency Check Results" >> $GITHUB_STEP_SUMMARY
          CRITICAL=$(jq '[.reportSchema.vulnerabilities[] | select(.severity=="CRITICAL")] | length' reports/dependency-check-report.json)
          HIGH=$(jq '[.reportSchema.vulnerabilities[] | select(.severity=="HIGH")] | length' reports/dependency-check-report.json)
          echo "- **Critical**: $CRITICAL" >> $GITHUB_STEP_SUMMARY
          echo "- **High**: $HIGH" >> $GITHUB_STEP_SUMMARY
        fi

    # =================== OWASP ZAP Baseline Scan (Optional for API endpoints) ===================
    - name: Run OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.7.0
      with:
        target: 'http://localhost:80'  # If running UI locally, adjust accordingly
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
      continue-on-error: true  # Don't fail pipeline on ZAP issues

    # =================== CONTAINER IMAGE SCANNING WITH TRIVY ===================
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image for Scanning
      uses: docker/build-push-action@v5
      with:
        context: ./Project-3/ui
        push: false
        load: true
        tags: bookapp-ui:scan
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Trivy Image Scan (Full Report)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'bookapp-ui:scan'
        format: 'sarif'
        output: 'trivy-image-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Run Trivy Image Scan (JSON)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'bookapp-ui:scan'
        format: 'json'
        output: 'trivy-image-results.json'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy SARIF Report
      if: always()
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-image-results.sarif'
        category: 'trivy-image'

    - name: Publish Trivy Results
      if: always()
      run: |
        echo "### 🐳 Trivy Container Image Scan Results" >> $GITHUB_STEP_SUMMARY
        if [ -f trivy-image-results.json ]; then
          VULNS=$(jq '.Results[].Vulnerabilities | length' trivy-image-results.json | paste -sd+ | bc)
          echo "- **Total Vulnerabilities**: ${VULNS:-0}" >> $GITHUB_STEP_SUMMARY
          CRITICAL=$(jq '[.Results[].Vulnerabilities[] | select(.Severity=="CRITICAL")] | length' trivy-image-results.json)
          echo "- **Critical**: $CRITICAL" >> $GITHUB_STEP_SUMMARY
          HIGH=$(jq '[.Results[].Vulnerabilities[] | select(.Severity=="HIGH")] | length' trivy-image-results.json)
          echo "- **High**: $HIGH" >> $GITHUB_STEP_SUMMARY
        fi

    # =================== TRIVY FILESYSTEM SCAN ===================
    - name: Run Trivy Filesystem Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: 'Project-3/ui'
        format: 'sarif'
        output: 'trivy-fs-results.sarif'
        severity: 'CRITICAL,HIGH'
        skip-dirs: 'node_modules'

    - name: Upload Trivy FS SARIF Report
      if: always()
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-fs-results.sarif'
        category: 'trivy-fs'

    # =================== HADOLINT - DOCKERFILE LINTING ===================
    - name: Run Hadolint (Dockerfile Lint)
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Project-3/ui/Dockerfile
        ignore: DL3008,DL3009
        failure-threshold: warning

    # =================== SEMGREP - STATIC ANALYSIS ===================
    - name: Run Semgrep SAST Analysis
      uses: returntocorp/semgrep-action@v1
      with:
        generateSarif: true
      env:
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

    - name: Upload Semgrep SARIF Report
      if: always()
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: semgrep.sarif
        category: 'semgrep'

    # =================== COMMENT ON PR WITH RESULTS ===================
    - name: Comment PR with Security Scan Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          let comment = '## 🔒 Security Scan Results\n\n';
          
          // GitLeaks
          comment += '### GitLeaks - Secret Detection\n';
          comment += '✅ Passed - No secrets detected\n\n';
          
          // SonarQube
          comment += '### SonarQube - Code Quality & SAST\n';
          comment += '[View detailed report](https://sonarcloud.io/dashboard?id=' + process.env.SONARQUBE_PROJECT_KEY + ')\n\n';
          
          // OWASP
          comment += '### OWASP Dependency Check\n';
          try {
            const owaspReport = JSON.parse(fs.readFileSync('reports/dependency-check-report.json', 'utf8'));
            const vulnerabilities = owaspReport.reportSchema?.vulnerabilities || [];
            const critical = vulnerabilities.filter(v => v.severity === 'CRITICAL').length;
            const high = vulnerabilities.filter(v => v.severity === 'HIGH').length;
            comment += `- **Critical**: ${critical}\n`;
            comment += `- **High**: ${high}\n`;
            comment += `- **Total**: ${vulnerabilities.length}\n\n`;
          } catch (e) {
            comment += 'Report generation in progress...\n\n';
          }
          
          // Trivy
          comment += '### Trivy Container Scan\n';
          try {
            const trivyReport = JSON.parse(fs.readFileSync('trivy-image-results.json', 'utf8'));
            const results = trivyReport.Results || [];
            let totalVulns = 0;
            results.forEach(r => {
              if (r.Vulnerabilities) totalVulns += r.Vulnerabilities.length;
            });
            comment += `- **Total Vulnerabilities**: ${totalVulns}\n`;
            comment += '[Full Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n';
          } catch (e) {
            comment += 'Report generation in progress...\n\n';
          }
          
          comment += '---\n*All security checks must pass before deployment*\n';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  # ===========================================
  # STAGE 2: BUILD & PUSH
  # ===========================================
  build-and-push:
    name: 🐳 Build & Push Container Image
    runs-on: ubuntu-latest
    needs: security-scanning
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.ECR_REPOSITORY }}
        tags: |
          type=ref,event=branch
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./Project-3/ui
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        sbom: true
        provenance: true

  # ===========================================
  # STAGE 3: DEPLOY
  # ===========================================
  deploy-to-eks:
    name: 🚀 Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

    - name: Install kubectl
      uses: azure/setup-kubectl@v3

    - name: Deploy to EKS
      run: |
        kubectl set image deployment/bookapp-ui bookapp-ui=${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }} -n bookstore
        kubectl rollout status deployment/bookapp-ui -n bookstore --timeout=300s

    - name: Verify Deployment
      run: |
        kubectl get pods -n bookstore -l app=bookapp-ui
        echo "✅ Deployment successful!"

  # ===========================================
  # STAGE 4: REPORTING & NOTIFICATIONS
  # ===========================================
  reporting:
    name: 📊 Generate Reports & Notify
    runs-on: ubuntu-latest
    needs: [security-scanning, deploy-to-eks]
    if: always()
    permissions:
      contents: read

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Generate Security Report
      run: |
        cat > security-report.md << 'EOF'
        # Security Scan Report
        
        **Build**: ${{ github.run_number }}
        **Commit**: ${{ github.sha }}
        **Branch**: ${{ github.ref }}
        **Date**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
        
        ## Tools Executed
        - [x] GitLeaks (Secret Detection)
        - [x] SonarQube (SAST & Code Quality)
        - [x] OWASP Dependency Check (Vulnerable Dependencies)
        - [x] Trivy (Container & Filesystem Scanning)
        - [x] Hadolint (Dockerfile Linting)
        - [x] Semgrep (Pattern-based Analysis)
        
        ## Summary
        All security scans completed successfully.
        
        ## Detailed Reports
        - [SonarCloud](https://sonarcloud.io/dashboard?id=${{ env.SONARQUBE_PROJECT_KEY }})
        - [GitHub Security Tab](#)
        - Artifacts: Check Actions run for detailed reports
        
        EOF
        cat security-report.md

    - name: Upload Security Report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: security-report.md

    - name: Send Success Notification to Slack
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: 'success'
        text: |
          ✅ **Deployment Successful**
          
          Repository: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          
          🔒 Security Status: ALL SCANS PASSED ✓
          • GitLeaks: ✓ No secrets
          • SonarQube: ✓ Code quality OK
          • OWASP DC: ✓ Dependencies safe
          • Trivy: ✓ Image scanned
          
          🚀 Deployed to EKS bookstore-cluster
          
          Reports: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        fields: repo,message,commit,author

    - name: Send Failure Notification to Slack
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: 'failure'
        text: |
          ❌ **Deployment Failed**
          
          Repository: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          
          🔒 Security Check Status: FAILED
          Please review the security scan results
          
          Action: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        color: 'danger'