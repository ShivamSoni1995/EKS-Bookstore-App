# ===========================================
# NAMESPACE
# ===========================================
apiVersion: v1
kind: Namespace
metadata:
  name: bookstore
---
# ===========================================
# BACKEND API DEPLOYMENT
# ===========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookapp-api
  namespace: bookstore
  labels:
    app: bookapp-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookapp-api
  template:
    metadata:
      labels:
        app: bookapp-api
    spec:
      containers:
      - name: bookapp-api
        image: shivamsoni1995/bookapp-api:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
# ===========================================
# BACKEND API SERVICE
# ===========================================
apiVersion: v1
kind: Service
metadata:
  name: bookapp-api-service
  namespace: bookstore
  labels:
    app: bookapp-api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  selector:
    app: bookapp-api
---
# ===========================================
# FRONTEND UI DEPLOYMENT
# ===========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookapp-ui
  namespace: bookstore
  labels:
    app: bookapp-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookapp-ui
  template:
    metadata:
      labels:
        app: bookapp-ui
    spec:
      containers:
      - name: bookapp-ui
        image: shivamsoni1995/bookapp-ui:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
# ===========================================
# FRONTEND UI SERVICE
# ===========================================
apiVersion: v1
kind: Service
metadata:
  name: bookapp-ui-service
  namespace: bookstore
  labels:
    app: bookapp-ui
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: bookapp-ui
---
# ===========================================
# INGRESS RESOURCE (WITHOUT CUSTOM DOMAIN)
# ===========================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookstore-ingress
  namespace: bookstore
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    alb.ingress.kubernetes.io/tags: Environment=dev,Application=bookstore
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: bookapp-api-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bookapp-ui-service
            port:
              number: 80
---
# ===========================================
# HORIZONTAL POD AUTOSCALER - API
# ===========================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bookapp-api-hpa
  namespace: bookstore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bookapp-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
# ===========================================
# HORIZONTAL POD AUTOSCALER - UI
# ===========================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bookapp-ui-hpa
  namespace: bookstore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bookapp-ui
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
